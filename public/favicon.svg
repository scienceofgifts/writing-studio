<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Emerald Writing / Science Accent Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Gift Box Body with Gold Metallic Border -->
  <rect x="14" y="28" width="36" height="24" rx="4" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Gift Box Lid -->
  <rect x="11" y="21" width="42" height="9" rx="3" fill="url(#goldGrad)" />

  <!-- Vertical Ribbon -->
  <rect x="28" y="21" width="8" height="31" fill="url(#emeraldGrad)" />

  <!-- Quill / Nib Symbol Emerging from Bow Ribbon -->
  <!-- Stylized Pen Nib / Gift Bow Ribbon -->
  <path d="M32 8 C26 14 26 21 32 21 C38 21 38 14 32 8 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  
  <!-- Center Nib Line -->
  <line x1="32" y1="11" x2="32" y2="17" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Nib Breather Hole / Science Atom Sparkle -->
  <circle cx="32" cy="15" r="1.2" fill="#0f172a" />

  <!-- Science Sparkle / Empirical Insight Stars -->
  <path d="M46 12 L47.5 15 L50.5 16.5 L47.5 18 L46 21 L44.5 18 L41.5 16.5 L44.5 15 Z" fill="#fbbf24" opacity="0.9" />
  <path d="M16 14 L17 16 L19 17 L17 18 L16 20 L15 18 L13 17 L15 16 Z" fill="#34d399" opacity="0.8" />
</svg>
